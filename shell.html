<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shell Mokrice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#D5001C;
    --red-dark:#a3010f;
    --yellow:#FFC700;
    --ink:#1a1613;
    --paper:#f6f2ea;
    --paper-dim:#eee8dc;
    --muted:#8a8073;
    --line:rgba(26,22,19,0.14);
    --font-head:'Oswald', 'Arial Narrow', sans-serif;
    --font-body:'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{min-height:100vh;display:none;flex-direction:column;}
  .screen.active{display:flex;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- LANDING ---------- */
  #landing{
    background:
      radial-gradient(120% 90% at 50% -10%, #3a0509 0%, var(--ink) 55%),
      var(--ink);
    color:var(--paper);
    justify-content:space-between;
    align-items:center;
    text-align:center;
    padding:8vh 6vw 6vh;
  }
  .landing-top{width:100%;max-width:640px;}
  .scene{width:100%;max-width:520px;margin:0 auto;}
  .hero-photo{
    width:100%;display:block;border:2px solid var(--yellow);
    box-shadow:0 18px 40px -12px rgba(0,0,0,0.6);
    object-fit:cover;
  }
  .brand{
    font-family:var(--font-head);
    font-weight:700;
    font-size:clamp(2.6rem,10vw,4.2rem);
    letter-spacing:0.02em;
    line-height:0.95;
    margin:0.6em 0 0;
  }
  .brand span{color:var(--yellow);}
  .entry-wrap{width:100%;max-width:420px;}
  .entry-btn{
    width:100%;
    position:relative;
    background:var(--yellow);
    color:var(--ink);
    border:none;
    padding:1.15em 0;
    font-family:var(--font-head);
    font-weight:600;
    font-size:1.25rem;
    letter-spacing:0.06em;
    overflow:hidden;
    transition:transform .15s ease, background .15s ease;
  }
  .entry-btn::before,.entry-btn::after{
    content:"";
    position:absolute;top:0;bottom:0;width:14px;
    background:repeating-linear-gradient(135deg,var(--ink) 0 6px,transparent 6px 12px);
    opacity:0.85;
  }
  .entry-btn::before{left:0;}
  .entry-btn::after{right:0;}
  .entry-btn:hover{background:#ffd633;transform:translateY(-1px);}
  .entry-btn:active{transform:translateY(0);}
  .entry-hint{margin-top:0.7em;font-size:0.8rem;color:#8a8073;}

  /* ---------- SHARED APP CHROME ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:1.1em 1.3em;
    border-bottom:2px solid var(--ink);
    background:var(--paper);
    position:sticky;top:0;z-index:10;
  }
  .wordmark{
    font-family:var(--font-head);font-weight:700;font-size:1.05rem;
    letter-spacing:0.03em;display:flex;align-items:center;gap:0.5em;
  }
  .wordmark .dot{width:9px;height:9px;background:var(--red);display:inline-block;}
  .link-btn{
    background:none;border:none;color:var(--ink);
    font-size:0.85rem;font-weight:600;
    text-decoration:none;border-bottom:1px solid var(--ink);
    padding:0.2em 0;
  }
  .link-btn:hover{color:var(--red);border-color:var(--red);}

  .content{flex:1;padding:1.4em 1.3em 6em;max-width:760px;width:100%;margin:0 auto;}
  h1.page-title{
    font-family:var(--font-head);font-size:1.6rem;font-weight:600;
    margin:0.2em 0 0.1em;letter-spacing:0.01em;
  }
  p.page-sub{color:var(--muted);margin:0 0 1.4em;font-size:0.92rem;}

  /* ---------- NAV LIST (categories / subcategories, order + admin) ---------- */
  .nav-list{display:flex;flex-direction:column;gap:0.6em;}
  .nav-row{
    display:flex;align-items:center;gap:1em;
    background:#fff;border:1px solid var(--line);border-left:6px solid var(--red);
    padding:0.85em 1.1em;text-align:left;width:100%;cursor:pointer;
    transition:background .12s ease, transform .12s ease;
  }
  .nav-row:nth-child(3n+2){border-left-color:var(--yellow);}
  .nav-row:nth-child(3n){border-left-color:var(--ink);}
  .nav-row .row-thumb{
    width:44px;height:44px;object-fit:cover;flex-shrink:0;border:1px solid var(--line);background:var(--paper-dim);
  }
  .nav-row .row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:0.2em;}
  .nav-row .name{font-family:var(--font-head);font-weight:600;font-size:1.1rem;}
  .nav-row .count{color:var(--muted);font-size:0.8rem;}
  .nav-row .chevron{font-size:1.3rem;color:var(--muted);flex-shrink:0;}
  .nav-row .del{
    background:none;border:none;color:var(--muted);font-size:1.25rem;padding:0.1em 0.3em;line-height:1;flex-shrink:0;
  }
  .nav-row .del:hover{color:var(--red);}
  .nav-row .edit{
    background:none;border:none;color:var(--muted);font-size:1rem;padding:0.1em 0.3em;line-height:1;flex-shrink:0;
  }
  .nav-row .edit:hover{color:var(--ink);}
  .nav-row:hover{background:var(--paper-dim);}
  .nav-row:hover .chevron{color:var(--red);}

  .empty{
    border:1px dashed var(--line);padding:2em 1.3em;text-align:center;color:var(--muted);
    font-size:0.92rem;
  }

  .back-link{
    display:inline-flex;align-items:center;gap:0.35em;
    background:none;border:none;color:var(--muted);font-size:0.85rem;
    margin-bottom:0.9em;padding:0;font-weight:600;
  }
  .back-link:hover{color:var(--ink);}

  /* ---------- ITEM LIST ---------- */
  .item-row{
    display:flex;align-items:center;justify-content:space-between;gap:1em;
    padding:0.9em 0;border-bottom:1px solid var(--line);
  }
  .item-row .info{display:flex;align-items:center;gap:0.7em;min-width:0;}
  .item-row .info .name{font-weight:600;font-size:0.98rem;}
  .item-row .info .unit{color:var(--muted);font-size:0.8rem;}
  .item-thumb{
    width:38px;height:38px;object-fit:cover;flex-shrink:0;
    border:1px solid var(--line);background:var(--paper-dim);
  }
  .item-thumb-sm{
    width:28px;height:28px;object-fit:cover;flex-shrink:0;
    border:1px solid var(--line);background:var(--paper-dim);
  }
  .stepper{display:flex;align-items:center;border:1px solid var(--ink);flex-shrink:0;}
  .stepper button{
    width:34px;height:34px;background:var(--paper);border:none;
    font-size:1.1rem;font-weight:600;line-height:1;
  }
  .stepper button:hover{background:var(--yellow);}
  .stepper input{
    width:46px;height:34px;border:none;border-left:1px solid var(--ink);
    border-right:1px solid var(--ink);text-align:center;font-weight:600;font-size:0.95rem;
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  /* ---------- FLOATING SUMMARY BAR ---------- */
  .summary-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:space-between;
    padding:0.9em 1.3em;transform:translateY(110%);
    transition:transform .2s ease;z-index:20;
  }
  .summary-bar.show{transform:translateY(0);}
  .summary-bar .count{font-size:0.92rem;}
  .summary-bar .count b{color:var(--yellow);}
  .summary-bar button{
    background:var(--yellow);color:var(--ink);border:none;
    padding:0.6em 1.1em;font-weight:600;font-size:0.85rem;
    font-family:var(--font-head);letter-spacing:0.02em;
  }

  /* ---------- ORDER REVIEW ---------- */
  .review-cat{margin-bottom:1.8em;}
  .review-cat > h2{
    font-family:var(--font-head);font-size:1.05rem;font-weight:600;
    margin:0 0 0.6em;
  }
  .review-group{margin:0 0 1.2em;padding-left:0.9em;border-left:2px solid var(--line);}
  .review-group h3{
    font-family:var(--font-head);font-size:0.92rem;font-weight:600;color:var(--muted);
    margin:0 0 0.4em;
  }
  .review-row{display:flex;justify-content:space-between;padding:0.3em 0;font-size:0.92rem;}
  .review-row .qty{font-weight:600;}
  .review-actions{display:flex;gap:0.7em;margin-top:1.6em;flex-wrap:wrap;}
  .btn{
    border:1px solid var(--ink);background:var(--paper);color:var(--ink);
    padding:0.7em 1.2em;font-weight:600;font-size:0.85rem;font-family:var(--font-head);
    letter-spacing:0.02em;
  }
  .btn.primary{background:var(--ink);color:var(--paper);}
  .btn:hover{background:var(--yellow);border-color:var(--yellow);}
  .btn.primary:hover{background:var(--red);border-color:var(--red);color:#fff;}

  /* ---------- ADD FORMS ---------- */
  .add-form{display:flex;gap:0.5em;flex-wrap:wrap;align-items:center;margin-top:0.9em;}
  .add-form input[type=text]{flex:1;min-width:140px;border:1px solid var(--line);padding:0.6em 0.7em;font-size:0.9rem;background:#fff;}
  .add-form select{border:1px solid var(--line);padding:0.6em 0.7em;font-size:0.9rem;background:#fff;}
  .add-form button.submit-btn{
    background:var(--ink);color:var(--paper);border:none;padding:0 1em;height:2.6em;font-weight:600;
    font-family:var(--font-head);
  }
  .add-form button.submit-btn:hover{background:var(--red);}
  .inline-add-block{margin-top:1.2em;padding-top:1.1em;border-top:1px dashed var(--line);}
  .inline-add-block h3{
    font-family:var(--font-head);font-size:0.95rem;font-weight:600;margin:0 0 0.3em;
    color:var(--muted);
  }

  .photo-input-btn{
    display:inline-flex;align-items:center;gap:0.4em;
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:0.6em 0.8em;font-size:0.85rem;font-weight:500;height:2.6em;
  }
  .photo-input-btn:hover{border-color:var(--ink);}
  .photo-preview{
    width:36px;height:36px;object-fit:cover;border:1px solid var(--line);
  }
  .photo-x{
    background:none;border:none;color:var(--muted);font-size:1rem;padding:0 0.2em;
  }
  .photo-x:hover{color:var(--red);}
  .cam-icon-btn{
    background:none;border:1px solid var(--line);color:var(--muted);
    width:28px;height:28px;font-size:0.85rem;flex-shrink:0;
  }
  .cam-icon-btn:hover{border-color:var(--red);color:var(--red);}
  .admin-list{border-top:1px solid var(--line);}
  .admin-list-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:0.7em 0.2em;border-bottom:1px solid var(--line);
  }
  .admin-list-row .lbl{font-weight:500;font-size:0.94rem;}
  .admin-empty{color:var(--muted);font-size:0.9rem;padding:0.6em 0;}

  ::selection{background:var(--yellow);}
</style>
</head>

</script>
<script>
(function(){
  "use strict";

  // ---------- STORAGE ----------
  var LS_CAT = "shellmokrice_kategorije";
  var LS_SUBCAT = "shellmokrice_podkategorije";
  var LS_ITEM = "shellmokrice_artikli";
  var LS_ORDER = "shellmokrice_narudzba";

  function load(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function save(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  var state = {
    categories: load(LS_CAT, []),
    subcategories: load(LS_SUBCAT, []),
    items: load(LS_ITEM, []),
    order: load(LS_ORDER, {}),      // { itemId: qty }
    openCatId: null,                 // order screen: open category (browsing subcategories)
    openSubCatId: null,              // order screen: open subcategory (browsing items)
    adminCatId: null,                // admin: selected category
    adminSubCatId: null              // admin: selected subcategory
  };

  function saveAll(){
    save(LS_CAT, state.categories);
    save(LS_SUBCAT, state.subcategories);
    save(LS_ITEM, state.items);
    save(LS_ORDER, state.order);
  }

  // ---------- MIGRATION: old items had catId directly, no subcategory layer ----------
  (function migrate(){
    var legacyItems = state.items.filter(function(i){ return i.catId && !i.subCatId; });
    if(legacyItems.length === 0) return;
    var madeChange = false;
    legacyItems.forEach(function(it){
      var existing = state.subcategories.find(function(s){ return s.catId === it.catId && s.naziv === "Opće"; });
      if(!existing){
        existing = { id: uid(), catId: it.catId, naziv: "Opće", slika: null };
        state.subcategories.push(existing);
        madeChange = true;
      }
      it.subCatId = existing.id;
      delete it.catId;
      madeChange = true;
    });
    if(madeChange) saveAll();
  })();

  // ---------- SCREEN NAV ----------
  function showScreen(id){
    document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    window.scrollTo(0,0);
  }

  document.getElementById("btnEnter").addEventListener("click", function(){
    showScreen("order");
    renderOrder();
  });
  document.getElementById("btnGoAdmin").addEventListener("click", function(){
    showScreen("admin");
    renderAdmin();
  });
  document.getElementById("btnLeaveAdmin").addEventListener("click", function(){
    showScreen("order");
    renderOrder();
  });
  document.getElementById("btnCloseReview").addEventListener("click", function(){
    showScreen("order");
    renderOrder();
  });
  document.getElementById("btnReview").addEventListener("click", function(){
    showScreen("review");
    renderReview();
  });

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---------- IMAGE HELPERS ----------
  function compressImage(file, maxDim, quality, cb){
    if(!file) { cb(null); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        try{
          cb(canvas.toDataURL("image/jpeg", quality));
        }catch(err){ cb(null); }
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  function bindPhotoPicker(inputId, previewWrapId, onChange){
    var pending = { value: null };
    var input = document.getElementById(inputId);
    var wrap = document.getElementById(previewWrapId);
    if(!input) return pending;
    input.addEventListener("change", function(){
      var file = input.files && input.files[0];
      if(!file) return;
      compressImage(file, 480, 0.6, function(dataUrl){
        pending.value = dataUrl;
        wrap.innerHTML = dataUrl
          ? '<img class="photo-preview" src="' + dataUrl + '"><button class="photo-x" type="button" id="' + inputId + 'Clear">×</button>'
          : '';
        var clearBtn = document.getElementById(inputId + "Clear");
        if(clearBtn) clearBtn.addEventListener("click", function(){
          pending.value = null; input.value = ""; wrap.innerHTML = "";
        });
        if(onChange) onChange(pending.value);
      });
    });
    return pending;
  }

  function photoFormHtml(inputId, wrapId, label){
    return '<label class="photo-input-btn">📷 ' + (label || "Fotografija") +
             '<input type="file" id="' + inputId + '" accept="image/*" capture="environment" style="display:none">' +
           '</label>' +
           '<span id="' + wrapId + '"></span>';
  }

  // ================= ORDER SCREEN =================
  function renderOrder(){
    if(!state.openCatId){
      renderOrderCategories();
    } else if(!state.openSubCatId){
      renderOrderSubcategories(state.openCatId);
    } else {
      renderOrderItems(state.openSubCatId);
    }
    updateSummaryBar();
  }

  function renderOrderCategories(){
    var content = document.getElementById("orderContent");
    var cats = state.categories;
    var html = '<h1 class="page-title">Kategorije</h1>' +
               '<p class="page-sub">Odaberite kategoriju za pregled artikala.</p>';
    if(cats.length === 0){
      html += '<div class="empty">Još nema kategorija.<br>Otvorite <strong>Administrator</strong> panel i dodajte prvu kategoriju.</div>';
    } else {
      html += '<div class="nav-list">';
      cats.forEach(function(c){
        var subCount = state.subcategories.filter(function(s){ return s.catId === c.id; }).length;
        html += '<div class="nav-row" data-cat="' + c.id + '">' +
                  '<div class="row-main"><span class="name">' + esc(c.naziv) + '</span>' +
                  '<span class="count">' + subCount + ' ' + (subCount===1?'podkategorija':'podkategorija') + '</span></div>' +
                  '<span class="chevron">›</span>' +
                '</div>';
      });
      html += '</div>';
    }
    content.innerHTML = html;
    content.querySelectorAll(".nav-row").forEach(function(row){
      row.addEventListener("click", function(){
        state.openCatId = row.getAttribute("data-cat");
        renderOrder();
      });
    });
  }

  function renderOrderSubcategories(catId){
    var content = document.getElementById("orderContent");
    var cat = state.categories.find(function(c){ return c.id === catId; });
    if(!cat){ state.openCatId = null; renderOrder(); return; }
    var subs = state.subcategories.filter(function(s){ return s.catId === catId; });

    var html = '<button class="back-link" id="backToCats">‹ Kategorije</button>' +
                '<h1 class="page-title">' + esc(cat.naziv) + '</h1>';
    if(subs.length === 0){
      html += '<div class="empty">Ova kategorija još nema podkategorija. Dodajte prvu ispod.</div>';
    } else {
      html += '<div class="nav-list">';
      subs.forEach(function(s){
        var itemCount = state.items.filter(function(i){ return i.subCatId === s.id; }).length;
        html += '<div class="nav-row" data-sub="' + s.id + '">' +
                  (s.slika ? '<img class="row-thumb" src="' + s.slika + '" alt="">' : '') +
                  '<div class="row-main"><span class="name">' + esc(s.naziv) + '</span>' +
                  '<span class="count">' + itemCount + ' ' + (itemCount===1?'artikl':'artikala') + '</span></div>' +
                  '<span class="chevron">›</span>' +
                '</div>';
      });
      html += '</div>';
    }

    html += '<div class="inline-add-block"><h3>Dodaj podkategoriju</h3>' +
              '<div class="add-form">' +
                '<input type="text" id="inlineSubName" placeholder="Naziv podkategorije (npr. Zastave)">' +
                photoFormHtml("inlineSubPhoto", "inlineSubPhotoWrap") +
                '<button class="submit-btn" id="btnInlineAddSub">Dodaj</button>' +
              '</div></div>';

    content.innerHTML = html;

    document.getElementById("backToCats").addEventListener("click", function(){ state.openCatId = null; renderOrder(); });
    content.querySelectorAll(".nav-row").forEach(function(row){
      row.addEventListener("click", function(){
        state.openSubCatId = row.getAttribute("data-sub");
        renderOrder();
      });
    });

    var pendingSubPhoto = bindPhotoPicker("inlineSubPhoto", "inlineSubPhotoWrap");
    document.getElementById("btnInlineAddSub").addEventListener("click", addSub);
    document.getElementById("inlineSubName").addEventListener("keydown", function(e){ if(e.key==="Enter") addSub(); });
    function addSub(){
      var input = document.getElementById("inlineSubName");
      var name = input.value.trim();
      if(!name) return;
      state.subcategories.push({ id: uid(), catId: catId, naziv: name, slika: pendingSubPhoto.value || null });
      saveAll();
      renderOrderSubcategories(catId);
    }
  }

  function renderOrderItems(subCatId){
    var content = document.getElementById("orderContent");
    var sub = state.subcategories.find(function(s){ return s.id === subCatId; });
    if(!sub){ state.openSubCatId = null; renderOrder(); return; }
    var items = state.items.filter(function(i){ return i.subCatId === subCatId; });

    var html = '<button class="back-link" id="backToSubs">‹ Podkategorije</button>' +
                '<h1 class="page-title">' + esc(sub.naziv) + '</h1>';
    if(items.length === 0){
      html += '<div class="empty">Ova podkategorija još nema artikala. Dodajte prvi ispod.</div>';
    } else {
      html += '<div class="item-rows">';
      items.forEach(function(it){
        var qty = state.order[it.id] || 0;
        html += '<div class="item-row" data-item="' + it.id + '">' +
                  '<div class="info">' +
                  (it.slika ? '<img class="item-thumb" src="' + it.slika + '" alt="">' : '') +
                  '<div><div class="name">' + esc(it.naziv) + '</div>' +
                  (it.jedinica ? '<div class="unit">' + esc(it.jedinica) + '</div>' : '') +
                  '</div></div>' +
                  '<div class="stepper">' +
                    '<button class="dec">−</button>' +
                    '<input type="number" min="0" value="' + qty + '">' +
                    '<button class="inc">+</button>' +
                  '</div>' +
                '</div>';
      });
      html += '</div>';
    }

    html += '<div class="inline-add-block"><h3>Dodaj artikl u ovu podkategoriju</h3>' +
              '<div class="add-form">' +
                '<input type="text" id="inlineItemName" placeholder="Naziv artikla (npr. Zastava Shell Cafe)">' +
                '<select id="inlineItemUnit">' +
                  '<option value="kom">kom</option>' +
                  '<option value="kutija">kutija</option>' +
                  '<option value="pak">pak</option>' +
                  '<option value="rola">rola</option>' +
                  '<option value="">bez jedinice</option>' +
                '</select>' +
                photoFormHtml("inlineItemPhoto", "inlineItemPhotoWrap") +
                '<button class="submit-btn" id="btnInlineAddItem">Dodaj</button>' +
              '</div></div>';

    content.innerHTML = html;

    document.getElementById("backToSubs").addEventListener("click", function(){ state.openSubCatId = null; renderOrder(); });

    content.querySelectorAll(".item-row").forEach(function(row){
      var itemId = row.getAttribute("data-item");
      var input = row.querySelector("input");
      var dec = row.querySelector(".dec");
      var inc = row.querySelector(".inc");
      function setQty(v){
        v = Math.max(0, parseInt(v,10) || 0);
        if(v === 0){ delete state.order[itemId]; } else { state.order[itemId] = v; }
        input.value = v;
        saveAll();
        updateSummaryBar();
      }
      dec.addEventListener("click", function(){ setQty((parseInt(input.value,10)||0) - 1); });
      inc.addEventListener("click", function(){ setQty((parseInt(input.value,10)||0) + 1); });
      input.addEventListener("change", function(){ setQty(input.value); });
    });

    var pendingItemPhoto = bindPhotoPicker("inlineItemPhoto", "inlineItemPhotoWrap");
    document.getElementById("btnInlineAddItem").addEventListener("click", addInlineItem);
    document.getElementById("inlineItemName").addEventListener("keydown", function(e){ if(e.key==="Enter") addInlineItem(); });
    function addInlineItem(){
      var nameInput = document.getElementById("inlineItemName");
      var unitSelect = document.getElementById("inlineItemUnit");
      var name = nameInput.value.trim();
      if(!name) return;
      state.items.push({ id: uid(), subCatId: subCatId, naziv: name, jedinica: unitSelect.value, slika: pendingItemPhoto.value || null });
      saveAll();
      renderOrderItems(subCatId);
    }
  }

  function updateSummaryBar(){
    var bar = document.getElementById("summaryBar");
    var ids = Object.keys(state.order).filter(function(k){ return state.order[k] > 0; });
    var totalQty = ids.reduce(function(sum,k){ return sum + state.order[k]; }, 0);
    document.getElementById("summaryCount").textContent = totalQty;
    if(ids.length > 0){ bar.classList.add("show"); } else { bar.classList.remove("show"); }
  }

  // ================= ORDER REVIEW =================
  function buildOrderTree(){
    // catId -> { naziv, subs: { subCatId -> { naziv, slika, rows:[...] } } }
    var tree = {};
    Object.keys(state.order).forEach(function(itemId){
      var qty = state.order[itemId];
      if(qty <= 0) return;
      var item = state.items.find(function(i){ return i.id === itemId; });
      if(!item) return;
      var sub = state.subcategories.find(function(s){ return s.id === item.subCatId; });
      if(!sub) return;
      var cat = state.categories.find(function(c){ return c.id === sub.catId; });
      if(!cat) return;
      if(!tree[cat.id]) tree[cat.id] = { naziv: cat.naziv, subs: {} };
      if(!tree[cat.id].subs[sub.id]) tree[cat.id].subs[sub.id] = { naziv: sub.naziv, slika: sub.slika, rows: [] };
      tree[cat.id].subs[sub.id].rows.push({ naziv: item.naziv, jedinica: item.jedinica, qty: qty, slika: item.slika || null });
    });
    // ordered by state.categories / state.subcategories order
    var orderedCatIds = state.categories.map(function(c){ return c.id; }).filter(function(id){ return tree[id]; });
    return { tree: tree, catOrder: orderedCatIds };
  }

  function renderReview(){
    var content = document.getElementById("reviewContent");
    var built = buildOrderTree();
    var tree = built.tree, catOrder = built.catOrder;

    var html = '<h1 class="page-title">Pregled narudžbe</h1>';
    if(catOrder.length === 0){
      html += '<div class="empty">Narudžba je prazna. Vratite se na kategorije i unesite količine.</div>';
    } else {
      catOrder.forEach(function(catId){
        var catNode = tree[catId];
        html += '<div class="review-cat"><h2>' + esc(catNode.naziv) + '</h2>';
        var subIds = state.subcategories.filter(function(s){ return s.catId === catId && catNode.subs[s.id]; }).map(function(s){ return s.id; });
        subIds.forEach(function(subId){
          var subNode = catNode.subs[subId];
          html += '<div class="review-group"><h3>' + esc(subNode.naziv) + '</h3>';
          subNode.rows.forEach(function(row){
            html += '<div class="review-row"><span>' + esc(row.naziv) + (row.jedinica ? ' <span style="color:var(--muted)">(' + esc(row.jedinica) + ')</span>' : '') + '</span>' +
                    '<span class="qty">' + row.qty + '</span></div>';
          });
          html += '</div>';
        });
        html += '</div>';
      });
      html += '<div class="review-actions">' +
                '<button class="btn primary" id="btnPdf">Preuzmi PDF specifikaciju</button>' +
                '<button class="btn" id="btnPrint">Ispis</button>' +
                '<button class="btn" id="btnCopy">Kopiraj popis</button>' +
                '<button class="btn" id="btnClear">Isprazni narudžbu</button>' +
              '</div>';
    }
    content.innerHTML = html;

    var pdfBtn = document.getElementById("btnPdf");
    if(pdfBtn) pdfBtn.addEventListener("click", function(){ generatePdf(tree, catOrder); });

    var pBtn = document.getElementById("btnPrint");
    if(pBtn) pBtn.addEventListener("click", function(){ window.print(); });

    var cBtn = document.getElementById("btnCopy");
    if(cBtn) cBtn.addEventListener("click", function(){
      var text = "NARUDŽBA — SHELL MOKRICE\n\n";
      catOrder.forEach(function(catId){
        var catNode = tree[catId];
        text += catNode.naziv.toUpperCase() + "\n";
        var subIds = state.subcategories.filter(function(s){ return s.catId === catId && catNode.subs[s.id]; }).map(function(s){ return s.id; });
        subIds.forEach(function(subId){
          var subNode = catNode.subs[subId];
          text += "  " + subNode.naziv + ":\n";
          subNode.rows.forEach(function(row){
            text += "  - " + row.naziv + (row.jedinica ? " (" + row.jedinica + ")" : "") + ": " + row.qty + "\n";
          });
        });
        text += "\n";
      });
      if(navigator.clipboard){
        navigator.clipboard.writeText(text).then(function(){
          cBtn.textContent = "Kopirano ✓";
          setTimeout(function(){ cBtn.textContent = "Kopiraj popis"; }, 1500);
        });
      }
    });

    var clBtn = document.getElementById("btnClear");
    if(clBtn) clBtn.addEventListener("click", function(){
      if(confirm("Isprazniti cijelu narudžbu?")){
        state.order = {};
        saveAll();
        renderReview();
        updateSummaryBar();
      }
    });
  }

    doc.addFileToVFS("WorkSans-Bold.ttf", PDF_FONT_WORKSANS_BOLD);

    doc.text(dateStr, pageW - 14, 17, { align: "right" });

    var cursorY = 36;

    catOrder.forEach(function(catId){
      var catNode = tree[catId];
      var subIds = state.subcategories.filter(function(s){ return s.catId === catId && catNode.subs[s.id]; }).map(function(s){ return s.id; });

      if(cursorY > 258){ doc.addPage(); cursorY = 20; }

      // category header bar
      doc.setFillColor(ink[0], ink[1], ink[2]);
      doc.rect(14, cursorY, pageW - 28, 8, "F");
      doc.setTextColor(255, 255, 255);
      doc.setFont("Oswald", "bold");
      doc.setFontSize(12.5);
      doc.text(catNode.naziv.toUpperCase(), 18, cursorY + 5.6);
      cursorY += 13;

      subIds.forEach(function(subId){
        var subNode = catNode.subs[subId];

        if(cursorY > 250){ doc.addPage(); cursorY = 20; }

        // subcategory cover thumb + title (bigger cover image)
        var titleX = 14;
        var coverSize = 14;
        if(subNode.slika){
          try{ doc.addImage(subNode.slika, 14, cursorY, coverSize, coverSize); titleX = 14 + coverSize + 3; }catch(e){}
        }
        var titleBaseline = cursorY + (subNode.slika ? coverSize/2 + 2 : 5);
        doc.setFillColor(red[0], red[1], red[2]);
        doc.rect(titleX, titleBaseline - 4.2, 3, 5.5, "F");
        doc.setTextColor(ink[0], ink[1], ink[2]);
        doc.setFont("Oswald", "bold");
        doc.setFontSize(12);
        doc.text(subNode.naziv, titleX + 5, titleBaseline);
        cursorY += (subNode.slika ? coverSize + 4 : 9);

        var rows = subNode.rows;
        var IMG_SIZE = 24;
        var textX = 14 + IMG_SIZE + 5;
        var rowH = IMG_SIZE + 6;

        // column labels
        doc.setFont("WorkSans", "bold");
        doc.setFontSize(7.5);
        doc.setTextColor(muted[0], muted[1], muted[2]);
        doc.text("ARTIKL", textX, cursorY + 4);
        doc.text("KOLIČINA", pageW - 14, cursorY + 4, { align: "right" });
        cursorY += 7;
        doc.setDrawColor(225, 218, 206);
        doc.setLineWidth(0.3);
        doc.line(14, cursorY, pageW - 14, cursorY);
        cursorY += 4;

        rows.forEach(function(r){
          if(cursorY + rowH > 280){ doc.addPage(); cursorY = 20; }

          if(r.slika){
            try{ doc.addImage(r.slika, 14, cursorY, IMG_SIZE, IMG_SIZE); }catch(e){}
          } else {
            doc.setDrawColor(225, 218, 206);
            doc.setLineWidth(0.3);
            doc.rect(14, cursorY, IMG_SIZE, IMG_SIZE);
          }

          var midY = cursorY + IMG_SIZE / 2;

          doc.setFont("WorkSans", "bold");
          doc.setFontSize(12.5);
          doc.setTextColor(ink[0], ink[1], ink[2]);
          doc.text(r.naziv, textX, midY - (r.jedinica ? 1 : -1.5));

          if(r.jedinica){
            doc.setFont("WorkSans", "normal");
            doc.setFontSize(9);
            doc.setTextColor(muted[0], muted[1], muted[2]);
            doc.text(r.jedinica, textX, midY + 5);
          }

          doc.setFont("Oswald", "bold");
          doc.setFontSize(19);
          doc.setTextColor(red[0], red[1], red[2]);
          doc.text(String(r.qty), pageW - 14, midY + 3, { align: "right" });

          cursorY += rowH;
          doc.setDrawColor(238, 232, 220);
          doc.setLineWidth(0.25);
          doc.line(14, cursorY - 2, pageW - 14, cursorY - 2);
        });

        cursorY += 6;
      });

      cursorY += 2;
    });

    var pageCount = doc.internal.getNumberOfPages();
    for(var p = 1; p <= pageCount; p++){
      doc.setPage(p);
      var h = doc.internal.pageSize.getHeight();
      doc.setFont("WorkSans", "normal");
      doc.setFontSize(8);
      doc.setTextColor(muted[0], muted[1], muted[2]);
      doc.text("Shell Mokrice", 14, h - 10);
      doc.text(String(p) + " / " + pageCount, pageW - 14, h - 10, { align: "right" });
    }

    var fname = "shell-mokrice-specifikacija-" + now.getFullYear() +
      String(now.getMonth()+1).padStart(2,"0") + String(now.getDate()).padStart(2,"0") + ".pdf";
    doc.save(fname);
  }

  // ================= ADMIN =================
  function renderAdmin(){
    if(!state.adminCatId){
      renderAdminCategories();
    } else if(!state.adminSubCatId){
      renderAdminSubcategories(state.adminCatId);
    } else {
      renderAdminItems(state.adminSubCatId);
    }
  }

  function renderAdminCategories(){
    var content = document.getElementById("adminContent");
    var html = '<h1 class="page-title">Kategorije</h1>' +
               '<p class="page-sub">Dodajte kategoriju, zatim kliknite na nju da dodate podkategorije.</p>';
    if(state.categories.length === 0){
      html += '<div class="empty">Nema kategorija. Dodajte prvu ispod.</div>';
    } else {
      html += '<div class="nav-list">';
      state.categories.forEach(function(c){
        var subCount = state.subcategories.filter(function(s){ return s.catId === c.id; }).length;
        html += '<div class="nav-row" data-cat="' + c.id + '">' +
                  '<div class="row-main"><span class="name">' + esc(c.naziv) + '</span>' +
                  '<span class="count">' + subCount + ' podkategorija</span></div>' +
                  '<button class="edit" data-editcat="' + c.id + '" title="Preimenuj kategoriju">✎</button>' +
                  '<button class="del" data-delcat="' + c.id + '" title="Obriši kategoriju">×</button>' +
                '</div>';
      });
      html += '</div>';
    }
    html += '<div class="inline-add-block"><h3>Nova kategorija</h3>' +
              '<div class="add-form">' +
                '<input type="text" id="newCatName" placeholder="Naziv kategorije (npr. Vanjski dio)">' +
                '<button class="submit-btn" id="btnAddCat">Dodaj</button>' +
              '</div></div>';

    html += '<div class="inline-add-block"><h3>Sigurnosna kopija</h3>' +
              '<p class="page-sub" style="margin:0 0 0.8em;">Preuzmite kopiju svih kategorija, podkategorija, artikala i slika. Ako se nešto izbriše ili pokvari, vratite je ovdje.</p>' +
              '<div class="add-form">' +
                '<button class="btn" id="btnBackupExport" type="button">⬇ Preuzmi backup</button>' +
                '<label class="btn" id="btnBackupImportLabel" style="display:inline-flex;align-items:center;">⬆ Vrati iz backupa' +
                  '<input type="file" id="backupImportInput" accept="application/json,.json" style="display:none">' +
                '</label>' +
              '</div></div>';

    content.innerHTML = html;

    content.querySelectorAll(".nav-row").forEach(function(row){
      row.addEventListener("click", function(e){
        if(e.target.classList.contains("del") || e.target.classList.contains("edit")) return;
        state.adminCatId = row.getAttribute("data-cat");
        renderAdmin();
      });
    });
    content.querySelectorAll(".edit").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var catId = btn.getAttribute("data-editcat");
        var cat = state.categories.find(function(c){ return c.id === catId; });
        var novi = prompt("Novi naziv kategorije:", cat.naziv);
        if(novi === null) return;
        novi = novi.trim();
        if(!novi) return;
        cat.naziv = novi;
        saveAll();
        renderAdmin();
      });
    });
    content.querySelectorAll(".del").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var catId = btn.getAttribute("data-delcat");
        var cat = state.categories.find(function(c){ return c.id === catId; });
        var subs = state.subcategories.filter(function(s){ return s.catId === catId; });
        var subIds = subs.map(function(s){ return s.id; });
        var itemCount = state.items.filter(function(i){ return subIds.indexOf(i.subCatId) !== -1; }).length;
        var msg = (subs.length > 0)
          ? 'Obrisati kategoriju "' + cat.naziv + '", njenih ' + subs.length + ' podkategorija i ' + itemCount + ' artikala?'
          : 'Obrisati kategoriju "' + cat.naziv + '"?';
        if(confirm(msg)){
          state.items = state.items.filter(function(i){ return subIds.indexOf(i.subCatId) === -1; });
          state.subcategories = state.subcategories.filter(function(s){ return s.catId !== catId; });
          state.categories = state.categories.filter(function(c){ return c.id !== catId; });
          if(state.adminCatId === catId){ state.adminCatId = null; state.adminSubCatId = null; }
          if(state.openCatId === catId){ state.openCatId = null; state.openSubCatId = null; }
          saveAll();
          renderAdmin();
        }
      });
    });

    document.getElementById("btnAddCat").addEventListener("click", addCategory);
    document.getElementById("newCatName").addEventListener("keydown", function(e){ if(e.key==="Enter") addCategory(); });
    function addCategory(){
      var input = document.getElementById("newCatName");
      var name = input.value.trim();
      if(!name) return;
      var cat = { id: uid(), naziv: name };
      state.categories.push(cat);
      input.value = "";
      saveAll();
      renderAdmin();
    }

    document.getElementById("btnBackupExport").addEventListener("click", exportBackup);
    document.getElementById("backupImportInput").addEventListener("change", function(e){
      var file = e.target.files && e.target.files[0];
      if(file) importBackup(file);
      e.target.value = "";
    });
  }

  // ---------- BACKUP / RESTORE ----------
  function exportBackup(){
    var payload = {
      app: "shell-mokrice-narudzbe",
      verzija: 1,
      datum: new Date().toISOString(),
      kategorije: state.categories,
      podkategorije: state.subcategories,
      artikli: state.items,
      narudzba: state.order
    };
    var json = JSON.stringify(payload, null, 2);
    var blob = new Blob([json], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var now = new Date();
    var stamp = now.getFullYear() + String(now.getMonth()+1).padStart(2,"0") + String(now.getDate()).padStart(2,"0") +
      "-" + String(now.getHours()).padStart(2,"0") + String(now.getMinutes()).padStart(2,"0");
    a.href = url;
    a.download = "shell-mokrice-backup-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  function importBackup(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var data;
      try{
        data = JSON.parse(e.target.result);
      }catch(err){
        alert("Ovo nije ispravan backup fajl (nije valjani JSON).");
        return;
      }
      if(!data || !Array.isArray(data.kategorije) || !Array.isArray(data.podkategorije) || !Array.isArray(data.artikli)){
        alert("Ovo nije prepoznat kao backup ove aplikacije.");
        return;
      }
      var confirmMsg = "Vraćanje backupa (" + (data.datum ? new Date(data.datum).toLocaleString("hr-HR") : "nepoznat datum") + ") će " +
        "PREBRISATI sve trenutno spremljene kategorije, podkategorije, artikle i narudžbu. Nastaviti?";
      if(!confirm(confirmMsg)) return;

      state.categories = data.kategorije || [];
      state.subcategories = data.podkategorije || [];
      state.items = data.artikli || [];
      state.order = data.narudzba || {};
      state.adminCatId = null;
      state.adminSubCatId = null;
      state.openCatId = null;
      state.openSubCatId = null;
      saveAll();
      renderAdmin();
      alert("Backup uspješno vraćen.");
    };
    reader.onerror = function(){
      alert("Greška pri čitanju fajla.");
    };
    reader.readAsText(file);
  }

  function renderAdminSubcategories(catId){
    var content = document.getElementById("adminContent");
    var cat = state.categories.find(function(c){ return c.id === catId; });
    if(!cat){ state.adminCatId = null; renderAdmin(); return; }
    var subs = state.subcategories.filter(function(s){ return s.catId === catId; });

    var html = '<button class="back-link" id="backToAdminCats">‹ Kategorije</button>' +
                '<h1 class="page-title">' + esc(cat.naziv) + '</h1>' +
                '<p class="page-sub">Podkategorije — kliknite za unos artikala.</p>';
    if(subs.length === 0){
      html += '<div class="empty">Nema podkategorija. Dodajte prvu ispod.</div>';
    } else {
      html += '<div class="nav-list">';
      subs.forEach(function(s){
        var itemCount = state.items.filter(function(i){ return i.subCatId === s.id; }).length;
        html += '<div class="nav-row" data-sub="' + s.id + '">' +
                  (s.slika ? '<img class="row-thumb" src="' + s.slika + '" alt="">' : '') +
                  '<div class="row-main"><span class="name">' + esc(s.naziv) + '</span>' +
                  '<span class="count">' + itemCount + ' ' + (itemCount===1?'artikl':'artikala') + '</span></div>' +
                  '<button class="edit" data-editsub="' + s.id + '" title="Preimenuj podkategoriju">✎</button>' +
                  '<button class="del" data-delsub="' + s.id + '" title="Obriši podkategoriju">×</button>' +
                '</div>';
      });
      html += '</div>';
    }
    html += '<div class="inline-add-block"><h3>Nova podkategorija</h3>' +
              '<div class="add-form">' +
                '<input type="text" id="newSubName" placeholder="Naziv podkategorije (npr. Zastave)">' +
                photoFormHtml("newSubPhoto", "newSubPhotoWrap") +
                '<button class="submit-btn" id="btnAddSub">Dodaj</button>' +
              '</div></div>';
    content.innerHTML = html;

    document.getElementById("backToAdminCats").addEventListener("click", function(){ state.adminCatId = null; renderAdmin(); });

    content.querySelectorAll(".nav-row").forEach(function(row){
      row.addEventListener("click", function(e){
        if(e.target.classList.contains("del") || e.target.classList.contains("edit")) return;
        state.adminSubCatId = row.getAttribute("data-sub");
        renderAdmin();
      });
    });
    content.querySelectorAll(".edit").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var subId = btn.getAttribute("data-editsub");
        var sub = state.subcategories.find(function(s){ return s.id === subId; });
        var novi = prompt("Novi naziv podkategorije:", sub.naziv);
        if(novi === null) return;
        novi = novi.trim();
        if(!novi) return;
        sub.naziv = novi;
        saveAll();
        renderAdmin();
      });
    });
    content.querySelectorAll(".del").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var subId = btn.getAttribute("data-delsub");
        var sub = state.subcategories.find(function(s){ return s.id === subId; });
        var itemCount = state.items.filter(function(i){ return i.subCatId === subId; }).length;
        var msg = itemCount > 0
          ? 'Obrisati podkategoriju "' + sub.naziv + '" i njenih ' + itemCount + ' artikala?'
          : 'Obrisati podkategoriju "' + sub.naziv + '"?';
        if(confirm(msg)){
          state.items = state.items.filter(function(i){ return i.subCatId !== subId; });
          state.subcategories = state.subcategories.filter(function(s){ return s.id !== subId; });
          if(state.adminSubCatId === subId) state.adminSubCatId = null;
          if(state.openSubCatId === subId) state.openSubCatId = null;
          saveAll();
          renderAdmin();
        }
      });
    });

    var pendingSubPhoto = bindPhotoPicker("newSubPhoto", "newSubPhotoWrap");
    document.getElementById("btnAddSub").addEventListener("click", addSub);
    document.getElementById("newSubName").addEventListener("keydown", function(e){ if(e.key==="Enter") addSub(); });
    function addSub(){
      var input = document.getElementById("newSubName");
      var name = input.value.trim();
      if(!name) return;
      state.subcategories.push({ id: uid(), catId: catId, naziv: name, slika: pendingSubPhoto.value || null });
      saveAll();
      renderAdminSubcategories(catId);
    }
  }

  function renderAdminItems(subCatId){
    var content = document.getElementById("adminContent");
    var sub = state.subcategories.find(function(s){ return s.id === subCatId; });
    if(!sub){ state.adminSubCatId = null; renderAdmin(); return; }
    var items = state.items.filter(function(i){ return i.subCatId === subCatId; });

    var html = '<button class="back-link" id="backToAdminSubs">‹ Podkategorije</button>' +
                '<h1 class="page-title">' + esc(sub.naziv) + '</h1>' +
                '<p class="page-sub">Artikli u ovoj podkategoriji.</p>';

    if(items.length === 0){
      html += '<div class="admin-empty">Ova podkategorija još nema artikala.</div>';
    } else {
      html += '<div class="admin-list">' + items.map(function(it){
        return '<div class="admin-list-row">' +
                '<span class="lbl" style="display:flex;align-items:center;gap:0.6em;">' +
                (it.slika ? '<img class="item-thumb-sm" src="' + it.slika + '" alt="">' : '') +
                esc(it.naziv) + (it.jedinica ? ' <span style="color:var(--muted);font-weight:400;">— ' + esc(it.jedinica) + '</span>' : '') +
                '</span>' +
                '<span style="display:flex;align-items:center;gap:0.4em;">' +
                '<button class="cam-icon-btn" data-photoitem="' + it.id + '" title="Dodaj/promijeni sliku">📷</button>' +
                '<input type="file" class="hidden-photo-input" data-photofor="' + it.id + '" accept="image/*" capture="environment" style="display:none">' +
                '<button class="cam-icon-btn" data-edititem="' + it.id + '" title="Preimenuj artikl">✎</button>' +
                '<button class="del" data-delitem="' + it.id + '" title="Obriši artikl">×</button>' +
                '</span>' +
              '</div>';
      }).join("") + '</div>';
    }

    html += '<div class="inline-add-block"><h3>Novi artikl</h3>' +
              '<div class="add-form">' +
                '<input type="text" id="newItemName" placeholder="Naziv artikla">' +
                '<select id="newItemUnit">' +
                  '<option value="kom">kom</option>' +
                  '<option value="kutija">kutija</option>' +
                  '<option value="pak">pak</option>' +
                  '<option value="rola">rola</option>' +
                  '<option value="">bez jedinice</option>' +
                '</select>' +
                photoFormHtml("newItemPhoto", "newItemPhotoWrap") +
                '<button class="submit-btn" id="btnAddItem">Dodaj</button>' +
              '</div></div>';

    content.innerHTML = html;

    document.getElementById("backToAdminSubs").addEventListener("click", function(){ state.adminSubCatId = null; renderAdmin(); });

    var pendingNewPhoto = bindPhotoPicker("newItemPhoto", "newItemPhotoWrap");
    document.getElementById("btnAddItem").addEventListener("click", addItem);
    document.getElementById("newItemName").addEventListener("keydown", function(e){ if(e.key==="Enter") addItem(); });
    function addItem(){
      var nameInput = document.getElementById("newItemName");
      var unitSelect = document.getElementById("newItemUnit");
      var name = nameInput.value.trim();
      if(!name) return;
      state.items.push({ id: uid(), subCatId: subCatId, naziv: name, jedinica: unitSelect.value, slika: pendingNewPhoto.value || null });
      nameInput.value = "";
      saveAll();
      renderAdminItems(subCatId);
    }

    content.querySelectorAll(".cam-icon-btn[data-edititem]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var itemId = btn.getAttribute("data-edititem");
        var item = state.items.find(function(i){ return i.id === itemId; });
        var novi = prompt("Novi naziv artikla:", item.naziv);
        if(novi === null) return;
        novi = novi.trim();
        if(!novi) return;
        item.naziv = novi;
        saveAll();
        renderAdminItems(subCatId);
      });
    });

    content.querySelectorAll(".del").forEach(function(btn){
      btn.addEventListener("click", function(){
        var itemId = btn.getAttribute("data-delitem");
        state.items = state.items.filter(function(i){ return i.id !== itemId; });
        delete state.order[itemId];
        saveAll();
        renderAdminItems(subCatId);
      });
    });
    content.querySelectorAll(".cam-icon-btn[data-photoitem]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var itemId = btn.getAttribute("data-photoitem");
        var hiddenInput = content.querySelector('.hidden-photo-input[data-photofor="' + itemId + '"]');
        if(hiddenInput) hiddenInput.click();
      });
    });
    content.querySelectorAll(".hidden-photo-input").forEach(function(inp){
      inp.addEventListener("change", function(){
        var file = inp.files && inp.files[0];
        if(!file) return;
        var itemId = inp.getAttribute("data-photofor");
        compressImage(file, 480, 0.6, function(dataUrl){
          if(!dataUrl) return;
          var item = state.items.find(function(i){ return i.id === itemId; });
          if(item){
            item.slika = dataUrl;
            saveAll();
            renderAdminItems(subCatId);
          }
        });
      });
    });
  }

  // ---------- INIT ----------
  renderOrder();
})();

</script>
